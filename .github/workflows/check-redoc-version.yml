name: Check ReDoc Version

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get current ReDoc version
        id: current
        run: |
          # Single source of truth: the REDOC_VERSION constant in the template module.
          CURRENT=$(grep -oP "REDOC_VERSION = '\K[0-9]+\.[0-9]+\.[0-9]+" src/redoc-html-template.ts)

          if [ -z "$CURRENT" ]; then
            echo "::error file=src/redoc-html-template.ts::Could not extract REDOC_VERSION. If the constant was renamed or moved, update this workflow."
            exit 1
          fi

          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Get latest stable ReDoc version
        id: latest
        run: |
          # Get all versions, filter stable only (no -rc, -beta, -alpha, -canary)
          LATEST=$(npm view redoc versions --json | \
            jq -r '.[]' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            echo "::error::Could not determine the latest stable ReDoc version from npm."
            exit 1
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest stable version: $LATEST"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "New stable version available: $CURRENT -> $LATEST"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "Already on latest stable version ($CURRENT)"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue for Update
        if: steps.compare.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.current.outputs.version }}';
            const latest = '${{ steps.latest.outputs.version }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['redoc-update']
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes(`ReDoc ${latest}`)
            );

            if (existingIssue) {
              console.log('Issue already exists:', existingIssue.html_url);
              return;
            }

            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Update ReDoc to version ${latest}`,
              labels: ['redoc-update', 'dependencies'],
              body: `A new stable version of ReDoc is available.

            **Current:** ${current} → **Latest stable:** ${latest}

            ## 1. Review before changing anything

            - [ ] Read the [ReDoc ${latest} release notes](https://github.com/Redocly/redoc/releases/tag/v${latest})
            - [ ] Diff what actually changed: [v${current}...v${latest}](https://github.com/Redocly/redoc/compare/v${current}...v${latest})
            - [ ] Decide the package bump — ReDoc patch/minor → package **PATCH**; ReDoc major, compatible → **MINOR**; ReDoc major with breaking changes → **MAJOR**

            ## 2. Make the change

            The ReDoc version lives in exactly one place:

            - [ ] Bump \`REDOC_VERSION\` in \`src/redoc-html-template.ts\` — one line. The CDN URL is built from it.

            \`tests/redoc-express.spec.ts\` asserts the full rendered HTML and imports \`REDOC_VERSION\`, so it tracks the constant automatically. If it fails after the bump, the constant and the rendered output genuinely disagree — investigate rather than editing the expectation.

            ## 3. Verify

            - [ ] \`npm run lint\`
            - [ ] \`npm test\`
            - [ ] \`npm run build\`
            - [ ] Smoke test in a browser: mount the middleware against a real spec, confirm DevTools → Network loads \`redoc@${latest}\` with a 200, the page renders, and there are no console or CSP errors

            ## 4. Ship

            Branch flow is feature → \`dev\` → \`main\`.

            - [ ] Branch off \`dev\`, commit, open a PR into \`dev\` — CI runs lint/test/build on Node 20/22/24
            - [ ] Merge the PR, then merge \`dev\` into \`main\`
            - [ ] On \`main\`: \`npm version patch -m "chore(release): %s"\` (creates the commit and the \`vX.Y.Z\` tag)
            - [ ] \`git push origin main && git push origin vX.Y.Z\`
            - [ ] Create the [GitHub release](${repoUrl}/releases/new) for the new tag
            - [ ] \`npm publish\`
            - [ ] Merge \`main\` back into \`dev\` so it does not drift behind
            - [ ] Add the release link here and close this issue

            ## Reference

            - Runbook: \`MAINTENANCE.md\` (local, not committed)
            - Package releases: ${repoUrl}/releases
            `
            });
